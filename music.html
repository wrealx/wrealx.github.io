<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Music · Wreal X</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Space+Grotesk:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A0A0A;
            color: #E0E0E0;
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.8rem 5%;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            color: #FFD700;
            text-decoration: none;
            font-family: 'Creepster', cursive;
            letter-spacing: 0.05em;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
        }
        .logo:hover {
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.4);
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #FF8C00;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .nav-links a:hover {
            color: #FFD700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        .page-title {
            text-align: center;
            padding: 2rem 5% 0;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 800;
            color: #FFD700;
            font-family: 'Creepster', cursive;
            letter-spacing: 0.05em;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.1);
        }
        .page-sub {
            text-align: center;
            color: #FF8C00;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            margin-top: 0.2rem;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
        }
        .music-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2.5rem;
            padding: 3rem 5%;
            max-width: 1300px;
            margin: 0 auto;
        }
        .track-card {
            background: #0F0F0F;
            border-radius: 20px;
            padding: 1.8rem;
            border: 1px solid #1A1A1A;
            transition: all 0.4s;
        }
        .track-card:hover {
            border-color: #FFD700;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.06);
            transform: translateY(-6px);
        }
        .track-card h3 {
            font-size: 1.5rem;
            color: #FFD700;
            font-weight: 700;
            font-family: 'Creepster', cursive;
            letter-spacing: 0.05em;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
        }
        .track-card .artist {
            color: #FF8C00;
            font-size: 0.85rem;
            margin-bottom: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
        }
        .track-card .soundcloud-embed {
            width: 100%;
            height: 120px;
            border-radius: 10px;
            margin: 0.8rem 0;
            border: none;
        }
        .streaming-icons {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid #1A1A1A;
        }
        .streaming-icons a {
            color: #FF8C00;
            font-size: 1.3rem;
            transition: all 0.3s;
            text-decoration: none;
        }
        .streaming-icons a:hover {
            color: #FFD700;
            transform: scale(1.15);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        .streaming-icons a .label {
            font-size: 0.55rem;
            display: block;
            text-align: center;
            color: #FF8C00;
            margin-top: 2px;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .video-section {
            padding: 1rem 5% 3rem;
            max-width: 1300px;
            margin: 0 auto;
        }
        .video-section h2 {
