<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Contact · Wreal X</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #070707;
            --panel: rgba(18, 18, 18, 0.9);
            --text: #f3f3f3;
            --muted: #b8b8b8;
            --green: #39FF14;
            --line: rgba(255,255,255,0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background: radial-gradient(circle at top, rgba(57,255,20,0.08), transparent 35%), var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        a, button, input, textarea, select { font-family: 'Inter', 'Segoe UI', sans-serif; }
        nav { display:flex; justify-content:space-between; align-items:center; padding:1.8rem 5%; flex-wrap:wrap; gap:1rem; position:relative; z-index:10; }
        .logo { display:inline-flex; align-items:center; gap:0.35em; font-size:2.2rem; font-weight:800; color:var(--green); text-decoration:none; letter-spacing:0.1em; text-shadow:0 0 40px rgba(57,255,20,0.3), 0 0 80px rgba(57,255,20,0.1); }
        .logo .brand-mark { width:0.9em; height:0.9em; object-fit:cover; display:block; border-radius:0.18em; box-shadow:0 0 18px rgba(57,255,20,0.18); flex-shrink:0; }

        #nav-toggle { position:absolute; opacity:0; pointer-events:none; }
        .nav-toggle { display:none; position:absolute; right:5%; top:1.5rem; width:48px; height:48px; border:1px solid rgba(255,255,255,0.15); border-radius:12px; background:rgba(255,255,255,0.04); cursor:pointer; z-index:20; align-items:center; justify-content:center; flex-direction:column; gap:5px; transition:all 0.3s ease; }
        .nav-toggle .bar { display:block; width:22px; height:2px; border-radius:2px; background:#fff; }

        .nav-links { display:flex; gap:1.5rem; list-style:none; flex-wrap:wrap; align-items:center; justify-content:flex-end; }
        .nav-links a { color:#fff; text-decoration:none; font-weight:700; font-size:0.9rem; transition:all 0.3s ease; text-transform:uppercase; letter-spacing:0.08em; padding:0.5rem 1rem; border:1px solid rgba(255,255,255,0.12); border-radius:10px; background:rgba(255,255,255,0.04); }
        .nav-links a:hover { color:var(--green); border-color:var(--green); background:rgba(57,255,20,0.1); transform:translateY(-2px); box-shadow:0 0 30px rgba(57,255,20,0.1); }

        .page-hero { min-height:260px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:4rem 5% 2.5rem; background: linear-gradient(180deg, rgba(7,7,7,0.18), rgba(7,7,7,0.9)), url('https://iili.io/CD0qtob.png') center/cover no-repeat; }
        .page-hero h1 { font-size:clamp(2.5rem, 7vw, 6rem); letter-spacing:0.14em; text-transform:uppercase; font-weight:900; color:#fff; }
        .page-sub { margin-top:0.5rem; color:var(--green); letter-spacing:0.28em; text-transform:uppercase; font-weight:700; font-size:0.9rem; }

        .content { max-width:1100px; margin:0 auto; padding:2.5rem 5% 4rem; }
        .contact-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:1.5rem; }
        .card { background:var(--panel); border:1px solid var(--line); border-radius:22px; padding:1.5rem; box-shadow:0 22px 45px rgba(0,0,0,0.25); }
        .card h3 { font-size:0.82rem; text-transform:uppercase; letter-spacing:0.14em; color:var(--green); margin-bottom:0.75rem; }
        .card p, .card a { color:var(--text); text-decoration:none; line-height:1.8; }
        .socials { display:flex; flex-wrap:wrap; gap:0.9rem; margin-top:1rem; }
        .socials a { display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.04); border:1px solid var(--line); color:var(--text); }

        footer { text-align:center; padding:1.5rem 5% 2.5rem; color:rgba(255,255,255,0.65); font-size:0.8rem; border-top:1px solid rgba(255,255,255,0.06); }
        footer a { color:var(--green); text-decoration:none; }

        @media (max-width: 768px) {
            nav { display:flex; justify-content:space-between; align-items:center; padding:1.25rem 5%; min-height:70px; position:relative; }
            .logo { font-size:1.4rem; letter-spacing:0.08em; }
            .nav-toggle { display:flex; }
            .nav-links { position:absolute; top:4.6rem; right:5%; flex-direction:column; gap:0.75rem; align-items:stretch; min-width:180px; padding:0.85rem; background:rgba(10,10,10,0.95); border:1px solid rgba(255,255,255,0.12); border-radius:14px; box-shadow:0 20px 40px rgba(0,0,0,0.35); opacity:0; transform:translateX(120%); pointer-events:none; transition:transform 0.35s ease, opacity 0.35s ease; z-index:50; }
            #nav-toggle:checked ~ .nav-links { opacity:1; transform:translateX(0); pointer-events:auto; }
            .nav-links a { width:100%; text-align:center; padding:0.8rem 1rem; font-size:0.72rem; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo" aria-label="Wreal X home">
            <img class="brand-mark" src="https://files.catbox.moe/adx9wj.jpg" alt="Wreal X logo" />
            <span>WREAL X</span>
        </a>

        <input type="checkbox" id="nav-toggle" aria-label="Toggle navigation">
        <label for="nav-toggle" class="nav-toggle" aria-label="Open menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </label>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="music.html">Music</a></li>
            <li><a href="merch.html">Merch</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <section class="page-hero">
        <h1>Contact</h1>
        <p class="page-sub">Say hi</p>
    </section>

    <div class="content">
        <div class="contact-grid">
            <div class="card">
                <h3>Bookings</h3>
                <p><a href="mailto:booking@wrealx.com">booking@wrealx.com</a></p>
            </div>
            <div class="card">
                <h3>General</h3>
                <p><a href="mailto:hello@wrealx.com">hello@wrealx.com</a></p>
            </div>
            <div class="card">
                <h3>Follow</h3>
                <div class="socials">
                    <a href="https://instagram.com/wreal.x" target="_blank" rel="noopener" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                    <a href="https://twitter.com/Wreal_X" target="_blank" rel="noopener" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                    <a href="https://youtube.com/@wrealx" target="_blank" rel="noopener" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
                    <a href="https://spotify.com" target="_blank" rel="noopener" aria-label="Spotify"><i class="fab fa-spotify"></i></a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        © 2026 WREAL X · <a href="index.html">Back home</a>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const navToggle = document.getElementById('nav-toggle');
            const navLinks = document.querySelectorAll('.nav-links a');
            navLinks.forEach(function (link) {
                link.addEventListener('click', function () {
                    if (window.innerWidth <= 768 && navToggle) {
                        navToggle.checked = false;
                    }
                });
            });
        });
    </script>
</body>
</html>
