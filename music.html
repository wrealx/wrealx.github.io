<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music · Wreal X</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: radial-gradient(circle at top, rgba(57,255,20,0.08), transparent 35%), #070707;
      color: #F3F3F3;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    a, button, input, textarea, select { font-family: 'Inter', 'Segoe UI', sans-serif; }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.8rem 5%;
      flex-wrap: wrap;
      gap: 1rem;
      position: relative;
      z-index: 10;
    }

    .logo {
      display: inline-block;
      font-size: 2.2rem;
      font-weight: 800;
      color: #39FF14;
      text-decoration: none;
      letter-spacing: 0.1em;
      text-shadow: 0 0 40px rgba(57,255,20,0.3), 0 0 80px rgba(57,255,20,0.1);
    }
    .logo:hover {
      text-shadow: 0 0 60px rgba(57,255,20,0.5), 0 0 120px rgba(57,255,20,0.2);
    }

    #nav-toggle { position: absolute; opacity: 0; pointer-events: none; }

    .nav-toggle {
      display: none;
      position: absolute;
      right: 5%;
      top: 1.5rem;
      width: 48px;
      height: 48px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      cursor: pointer;
      z-index: 20;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
    }
    .nav-toggle .bar {
      display: block;
      width: 22px;
      height: 2px;
      border-radius: 2px;
      background: #FFFFFF;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
    }
    .nav-links a {
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.5rem 1rem;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      transition: all 0.3s ease;
    }
    .nav-links a:hover {
      color: #39FF14;
      border-color: #39FF14;
      background: rgba(57,255,20,0.1);
      transform: translateY(-2px);
    }

    .hero {
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem 5% 1rem;
    }
    .hero h1 {
      font-size: clamp(2.8rem, 7vw, 5rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      color: #FFFFFF;
      margin-bottom: 0.5rem;
    }
    .hero .arabic {
      color: #39FF14;
      font-size: clamp(1.1rem, 3vw, 1.8rem);
      font-weight: 700;
      letter-spacing: 0.12em;
    }
    .albums {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 5% 4rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
    }
    .album {
      background: rgba(20,20,20,0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 1.2rem;
      text-align: center;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .album:hover {
      transform: translateY(-4px);
      border-color: #39FF14;
    }
    .album .cover {
      width: 100%;
      aspect-ratio: 1;
      background: linear-gradient(135deg, rgba(57,255,20,0.25), rgba(255,255,255,0.08));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      color: #39FF14;
      font-size: 1.2rem;
      letter-spacing: 0.14em;
      font-weight: 700;
      text-transform: uppercase;
    }
    .album h3 {
      color: #FFFFFF;
      margin-bottom: 0.5rem;
      font-size: 1.2rem;
    }
    .album p {
      color: #B8B8B8;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    @media (max-width: 768px) {
      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.25rem 5%;
      }
      .logo { font-size: 1.4rem; letter-spacing: 0.08em; }
      .nav-toggle { display: flex; }
      .nav-links {
        position: absolute;
        top: 4.6rem;
        right: 5%;
        flex-direction: column;
        gap: 0.75rem;
        align-items: stretch;
        min-width: 180px;
        padding: 0.85rem;
        background: rgba(10,10,10,0.95);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 14px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.35);
        opacity: 0;
        transform: translateX(120%);
        pointer-events: none;
        transition: transform 0.35s ease, opacity 0.35s ease;
      }
      #nav-toggle:checked ~ .nav-links {
        opacity: 1;
        transform: translateX(0);
        pointer-events: auto;
      }
      .nav-links a {
        width: 100%;
        text-align: center;
        padding: 0.8rem 1rem;
        font-size: 0.72rem;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="logo">WREAL X</a>

    <input type="checkbox" id="nav-toggle" aria-label="Toggle navigation">
    <label for="nav-toggle" class="nav-toggle" aria-label="Open menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </label>

    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="music.html">Music</a></li>
      <li><a href="merch.html">Merch</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <section class="hero">
    <h1>MUSIC</h1>
    <div class="arabic">CURSED</div>
  </section>

  <div class="albums">
    <div class="album">
      <div class="cover">NX</div>
      <h3>Nightfall</h3>
      <p>Late-night emotion and restless motion.</p>
    </div>
    <div class="album">
      <div class="cover">DX</div>
      <h3>Dreams in Ash</h3>
      <p>For the quiet ones still chasing light.</p>
    </div>
    <div class="album">
      <div class="cover">VX</div>
      <h3>Velvet Pain</h3>
      <p>Smooth melodies stained with rough truth.</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const navToggle = document.getElementById('nav-toggle');
      const navLinks = document.querySelectorAll('.nav-links a');
      navLinks.forEach(function (link) {
        link.addEventListener('click', function () {
          if (window.innerWidth <= 768 && navToggle) navToggle.checked = false;
        });
      });
    });
  </script>
</body>
</html>
