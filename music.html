    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A0A0A;
            color: #E0E0E0;
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.8rem 5%;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FF2060, #00F0FF, #CCFF00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #E0E0E0;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: #00F0FF; }
        .page-title {
            text-align: center;
            padding: 2rem 5% 0;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 800;
            background: linear-gradient(135deg, #FF2060, #00F0FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .page-sub {
            text-align: center;
            color: #666;
            font-size: 1rem;
            letter-spacing: 0.2em;
            margin-top: 0.2rem;
        }
        /* MUSIC GRID */
        .music-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
            padding: 3rem 5%;
            max-width: 1300px;
            margin: 0 auto;
        }
        .track-card {
            background: #111;
            border-radius: 20px;
            padding: 1.8rem;
            border: 1px solid #1A1A1A;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
        }
        .track-card:hover {
            border-color: #00F0FF;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.06);
            transform: translateY(-6px);
        }
        .track-card .cover {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 12px;
            margin-bottom: 1.2rem;
            background-size: cover;
            background-position: center;
            border: 1px solid #222;
            transition: transform 0.3s;
        }
        .track-card:hover .cover {
            transform: scale(1.02);
        }
        .track-card h3 {
            font-size: 1.5rem;
            color: #fff;
            font-weight: 700;
        }
        .track-card .artist {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        /* SOUNDCLOUD EMBED */
        .track-card .soundcloud-embed {
            width: 100%;
            height: 120px;
            border-radius: 10px;
            margin: 0.8rem 0;
            border: none;
        }
        /* STREAMING ICONS */
        .streaming-icons {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid #1A1A1A;
        }
        .streaming-icons a {
            color: #555;
            font-size: 1.3rem;
            transition: all 0.3s;
            text-decoration: none;
        }
        .streaming-icons a:hover {
            color: #00F0FF;
            transform: scale(1.15);
        }
        .streaming-icons a .label {
            font-size: 0.6rem;
            display: block;
            text-align: center;
            color: #444;
            margin-top: 2px;
        }
        /* VIDEOS */
        .video-section {
            padding: 1rem 5% 3rem;
            max-width: 1300px;
            margin: 0 auto;
        }
        .video-section h2 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #CCFF00, #00F0FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        .video-grid iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 16px;
            border: 1px solid #1A1A1A;
            transition: all 0.3s;
        }
        .video-grid iframe:hover {
            border-color: #FF2060;
            box-shadow: 0 0 30px rgba(255, 32, 96, 0.1);
        }
        footer {
            text-align: center;
            padding: 2rem 5%;
            color: #333;
            font-size: 0.8rem;
            border-top: 1px solid #1A1A1A;
            margin-top: 2rem;
        }
        footer a { color: #00F0FF; text-decoration: none; }
        @media (max-width: 768px) {
            nav { flex-direction: column; }
            .nav-links { gap: 1rem; justify-content: center; }
            .music-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
