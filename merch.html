<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Merch · Wreal X</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Space+Grotesk:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A0A0A;
            color: #E0E0E0;
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.8rem 5%;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            color: #FFD700;
            text-decoration: none;
            font-family: 'Creepster', cursive;
            letter-spacing: 0.05em;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
        }
        .logo:hover {
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.4);
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #FF8C00;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .nav-links a:hover {
            color: #FFD700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        .page-title {
            text-align: center;
            padding: 2rem 5% 0;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 800;
            color: #FFD700;
            font-family: 'Creepster', cursive;
            letter-spacing: 0.05em;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.1);
        }
        .page-sub {
            text-align: center;
            color: #FF8C00;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            margin-top: 0.2rem;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
        }
        .merch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2.5rem;
            padding: 3rem 5%;
            max-width: 1300px;
            margin: 0 auto;
        }
        .merch-item {
            background: #0F0F0F;
            border-radius: 20px;
            padding: 1.8rem;
            border: 1px solid #1A1A1A;
            transition: all 0.4s;
            text-align: center;
        }
        .merch-item:hover {
            border-color: #FFD700;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.06);
            transform: translateY(-6px);
        }
        .merch-item .merch-image {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 12px;
            background-size: cover;
            background-position: center;
            margin-bottom: 1rem;
            border: 1px solid #1A1A1A;
            transition: all 0.3s;
        }
        .merch-item .merch-image:hover {
            border-color: #FFD700;
            transform: scale(1.02);
        }
        .merch-item h3 {
            font-size: 1.3rem;
            color: #FFD700;
            margin-bottom: 0.3rem;
            font-family: 'Creepster', cursive;
            letter-spacing: 0.05em;
        }
        .merch-item .tag {
            display: inline-block;
            background: #FF6B00;
            color: #0A0A0A;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.2rem 1rem;
            border-radius: 20px;
            text-align: center;
            margin: 0 auto 1rem;
            display: table;
            letter-spacing: 0.1em;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
        }
        .merch-item .buy-btn {
            display: inline-block;
            padding: 0.8rem 3rem;
            background: #FF6B00;
            color: #0A0A0A;
            font-weight: 700;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            border: none;
            cursor: pointer;
            margin-top: 0.5rem;
            box-shadow: 0 0 40px rgba(255, 107, 0, 0.15);
        }
        .merch-item .buy-btn:hover {
            background: #FFD700;
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.3);
        }
        .soundplate-link {
            text-align: center;
            padding: 1rem 5% 2rem;
        }
        .soundplate-link a {
            display: inline-block;
            padding: 0.8rem 2.5rem;
            background: #FF6B00;
            color: #0A0A0A;
            font-weight: 700;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s;
            font-size: 0.95rem;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            box-shadow: 0 0 40px rgba(255, 107, 0, 0.2);
        }
        .soundplate-link a:hover {
            background: #FFD700;
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.3);
        }
        footer {
            text-align: center;
            padding: 2rem 5%;
            color: #FF8C00;
            font-size: 0.8rem;
            border-top: 1px solid #1A1A1A;
            margin-top: 2rem;
            font-family: 'JetBrains Mono', monospace;
        }
        footer a {
            color: #FFD700;
            text-decoration: none;
        }
        @media (max-width: 768px) {
            nav { flex-direction: column; }
            .nav-links { gap: 1rem; justify-content: center; }
            .merch-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
