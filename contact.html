<!DOCTYPE html>

<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {

            z-index: 10;

            gap: 0.35em;

            font-weight: 900;
            color: #39FF14;

            text-shadow: 0 0 40px rgba(57, 255, 20, 0.3), 0 0 80px rgba(57, 255, 20, 0.1);
        }
        .logo .brand-mark {
            width: 0.9em;
            height: 0.9em;
            object-fit: cover;
            display: block;
            border-radius: 0.18em;
            box-shadow: 0 0 18px rgba(57,255,20,0.18);

<nav>
