<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>About · Wreal X</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Space+Grotesk:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A0A0A;
            color: #E0E0E0;
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.8rem 5%;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            color: #FFD700;
            text-decoration: none;
            font-family: 'Creepster', cursive;
            letter-spacing: 0.05em;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
        }
        .logo:hover {
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.4);
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #FF8C00;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .nav-links a:hover {
            color: #FFD700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        .page-title {
            text-align: center;
            padding: 2rem 5% 0;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 800;
            color: #FFD700;
            font-family: 'Creepster', cursive;
            letter-spacing: 0.05em;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.1);
        }
        .about-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            padding: 3rem 5%;
            max-width: 1300px;
            margin: 0 auto;
            align-items: start;
            min-height: 70vh;
        }
        .about-image {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 50%;
            border: 3px solid #FF6B00;
            box-shadow: 0 0 60px rgba(255, 107, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s;
            background-image: url('https://iili.io/CDxyUOv.jpg');
            background-size: cover;
            background-position: center;
            position: sticky;
            top: 2rem;
        }
        .about-image:hover {
            border-color: #FFD700;
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.2);
            transform: scale(1.02);
        }
        .about-text h2 {
            font-size: clamp(2.5rem, 4vw, 3.5rem);
            margin-bottom: 0.3rem;
            font-weight: 800;
            color: #FFD700;
            font-family: 'Creepster', cursive;
            letter-spacing: 0.05em;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.1);
        }
        .about-text .real-name {
            color: #FF8C00;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            letter-spacing: 0.05em;
            font-family: 'JetBrains Mono', monospace;
        }
        .about-text .real-name span {
            color: #FFD700;
            font-weight: 600;
        }
        .about-text .bio {
            font-size: 1.05rem;
            line-height: 1.9;
            color: #E0E0E0;
            margin-bottom: 1.2rem;
            font-weight: 300;
        }
        .about-text .bio strong {
            color: #FFD700;
            font-weight: 700;
        }
        .about-text .highlight {
            font-size: 1.6rem;
            font-weight: 700;
            color: #FF6B00;
            border-left: 4px solid #FFD700;
            padding-left: 1.2rem;
            margin: 1.8rem 0;
            line-height: 1.3;
            font-family: 'Creepster', cursive;
            text-shadow: 0 0 40px rgba(255, 107, 0, 0.1);
        }
        .about-text .details {
            color: #FF8C00;
            font-size: 0.95rem;
            line-height: 1.8;
            margin-top: 1rem;
            font-family: 'JetBrains Mono', monospace;
        }
        .about-text .details span {
            color: #FFD700;
            font-weight: 600;
        }
        .about-text .details .label {
            color: #FF8C00;
            font-weight: 400;
        }
        .about-text .social-links {
            display: flex;
            gap: 1.2rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }
        .about-text .social-links a {
            color: #FF8C00;
            font-size: 1.8rem;
            transition: all 0.3s;
        }
        .about-text .social-links a:hover {
            color: #FFD700;
            transform: translateY(-3px);
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }
        .about-text .milestones {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
            padding: 1.2rem;
            background: #0F0F0F;
            border-radius: 16px;
            border: 1px solid #FF6B00;
        }
        .about-text .milestones .milestone {
            text-align: center;
        }
        .about-text .milestones .milestone .num {
            font-size: 1.8rem;
            font-weight: 800;
            color: #FFD700;
            font-family: 'Creepster', cursive;
        }
        .about-text .milestones .milestone .desc {
            font-size: 0.65rem;
            color: #FF8C00;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-family: 'JetBrains Mono', monospace;
        }
        footer {
            text-align: center;
            padding: 2rem 5%;
            color: #FF8C00;
            font-size: 0.8rem;
            border-top: 1px solid #1A1A1A;
            margin-top: 2rem;
            font-family: 'JetBrains Mono', monospace;
        }
        footer a {
            color: #FFD700;
            text-decoration: none;
        }
        @media (max-width: 900px) {
            .about-container { grid-template-columns: 1fr; }
            .about-image { 
                max-width: 280px; 
                margin: 0 auto;
                position: relative;
                top: 0;
            }
            .about-text .highlight { border-left: none; padding-left: 0; }
            .about-text .social-links { justify-content: center; }
            .about-text { text-align: center; }
        }
        @media (max-width: 768px) {
            nav { flex-direction: column; }
            .nav-links { gap: 1rem; justify-content: center; }
            .about-text .milestones { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .about-text .milestones { grid-template-columns: 1fr; }
        }
    </style>
</head>
