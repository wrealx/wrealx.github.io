<!DOCTYPE html>
<!-- WREAL X live deployment refresh -->
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Wreal X · Official Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: linear-gradient(180deg, #070707 0%, #0A0A0A 25%, #0A0A0A 100%);
            color: #E0E0E0;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            transition: background 0.8s ease;
        }
        a, button, input, textarea, select {
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.8rem 5%;
            flex-wrap: wrap;
            gap: 1rem;
            position: relative;
            z-index: 10;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 0.35em;
            font-size: 2.2rem;
            font-weight: 800;
            color: #39FF14;
            text-decoration: none;
            letter-spacing: 0.1em;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            text-shadow: 0 0 40px rgba(57, 255, 20, 0.3), 0 0 80px rgba(57, 255, 20, 0.1);
        }
        .logo:hover {
            text-shadow: 0 0 60px rgba(57, 255, 20, 0.5), 0 0 120px rgba(57, 255, 20, 0.2);
        }
        .logo .brand-mark {
            width: 0.9em;
            height: 0.9em;
            object-fit: cover;
            display: block;
            border-radius: 0.18em;
            box-shadow: 0 0 18px rgba(57,255,20,0.18);
            flex-shrink: 0;
        }

        #nav-toggle { position: absolute; opacity: 0; pointer-events: none; }

        .nav-toggle {
            display: none;
            position: absolute;
            right: 5%;
            top: 1.5rem;
            width: 48px;
            height: 48px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            cursor: pointer;
            z-index: 20;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 5px;
            transition: all 0.3s ease;
        }
        .nav-toggle:hover {
            border-color: rgba(57,255,20,0.6);
            box-shadow: 0 0 20px rgba(57,255,20,0.12);
        }
        .nav-toggle .bar {
            display: block;
            width: 22px;
            height: 2px;
            border-radius: 2px;
            background: #FFFFFF;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
        }
        .nav-links a {
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.5rem 1rem;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            background: rgba(255,255,255,0.04);
        }
        .nav-links a:hover {
            color: #39FF14;
            border-color: #39FF14;
            background: rgba(57,255,20,0.1);
            text-shadow: 0 0 30px rgba(57,255,20,0.3);
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(57,255,20,0.1);
        }

        .nav-hint {
            position: fixed;
            right: 7.5rem;
            top: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.6rem 0.9rem 0.6rem 0.75rem;
            border-radius: 999px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid rgba(57,255,20,0.4);
            box-shadow: 0 0 25px rgba(57,255,20,0.15);
            transform-origin: center;
            z-index: 25;
            pointer-events: none;
            animation: navHintMotion 1.8s ease-in-out infinite;
        }
        .nav-hint::after {
            content: '';
            position: absolute;
            right: -14px;
            top: 50%;
            width: 18px;
            height: 2px;
            background: rgba(57,255,20,0.9);
            transform: translateY(-50%) rotate(14deg);
            border-radius: 999px;
        }
        .nav-hint-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(57,255,20,0.1);
            color: #39FF14;
            font-size: 1rem;
            animation: handPulse 1.3s ease-in-out infinite alternate;
        }
        .nav-hint-text {
            color: #E9FEEB;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-size: 0.58rem;
        }

        @keyframes navHintMotion {
            0%, 100% { transform: translateX(0) translateY(0) rotate(0deg); }
            20% { transform: translateX(-6px) translateY(-5px) rotate(-5deg); }
            40% { transform: translateX(2px) translateY(1px) rotate(3deg); }
            60% { transform: translateX(-4px) translateY(-3px) rotate(-2deg); }
            80% { transform: translateX(6px) translateY(-6px) rotate(4deg); }
        }
        @keyframes handPulse {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.12) rotate(8deg); }
        }

        .hero {
            min-height: 52vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 4rem 5% 2rem;
        }
        .hero h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            letter-spacing: 0.04em;
            color: #FFFFFF;
            margin-bottom: 0.4rem;
        }
        .hero .arabic {
            color: #39FF14;
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .hero .sub {
            color: #39FF14;
            font-size: 0.78rem;
            letter-spacing: 0.22em;
            margin-top: 0.7rem;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            nav {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 1.25rem 5%;
                min-height: 70px;
                position: relative;
            }
            .logo {
                font-size: 1.4rem;
                letter-spacing: 0.08em;
            }
            .nav-toggle { display: flex; }
            .nav-links {
                position: absolute;
                top: 4.6rem;
                right: 5%;
                flex-direction: column;
                gap: 0.75rem;
                align-items: stretch;
                min-width: 180px;
                padding: 0.85rem;
                background: rgba(10,10,10,0.95);
                border: 1px solid rgba(255,255,255,0.12);
                border-radius: 14px;
                box-shadow: 0 20px 40px rgba(0,0,0,0.35);
                opacity: 0;
                transform: translateX(120%);
                pointer-events: none;
                transition: transform 0.35s ease, opacity 0.35s ease;
                z-index: 50;
            }
            #nav-toggle:checked ~ .nav-links {
                opacity: 1;
                transform: translateX(0);
                pointer-events: auto;
            }
            .nav-links a {
                width: 100%;
                text-align: center;
                padding: 0.8rem 1rem;
                font-size: 0.72rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo" aria-label="Wreal X home">
            <img class="brand-mark" src="https://files.catbox.moe/adx9wj.jpg" alt="Wreal X logo" />
            <span>WREAL X</span>
        </a>

        <input type="checkbox" id="nav-toggle" aria-label="Toggle navigation">
        <label for="nav-toggle" class="nav-toggle" aria-label="Open menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </label>

        <div class="nav-hint" aria-hidden="true">
            <span class="nav-hint-icon"><i class="fa-solid fa-hand-pointer"></i></span>
            <span class="nav-hint-text">Explore</span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="music.html">Music</a></li>
            <li><a href="merch.html">Merch</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <section class="hero">
        <h1>CURSED</h1>
        <div class="arabic">الملعون</div>
        <div class="sub">Wreal X</div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const navToggle = document.getElementById('nav-toggle');
            const navLinks = document.querySelectorAll('.nav-links a');
            navLinks.forEach(function (link) {
                link.addEventListener('click', function () {
                    if (window.innerWidth <= 768 && navToggle) navToggle.checked = false;
                });
            });
        });
    </script>
</body>
</html>
