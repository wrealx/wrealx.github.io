<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Wreal X · Official Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Space+Grotesk:wght@300;400;600;700&family=Major+Mono+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A0A0A;
            color: #E0E0E0;
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .cookie-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 10, 0.95);
            border-top: 2px solid #00D4FF;
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            z-index: 9999;
            backdrop-filter: blur(10px);
            transition: transform 0.5s ease;
            box-shadow: 0 -10px 60px rgba(0, 212, 255, 0.1);
        }
        .cookie-banner.hidden { 
            transform: translateY(100%);
            display: none;
        }
        .cookie-banner p {
            font-size: 0.9rem;
            color: #00B4D8;
            max-width: 600px;
            font-family: 'Major Mono Display', monospace;
        }
        .cookie-banner p a {
            color: #00D4FF;
            text-decoration: none;
        }
        .cookie-buttons {
            display: flex;
            gap: 1rem;
        }
        .cookie-buttons button {
            padding: 0.5rem 1.8rem;
            border: none;
            border-radius: 30px;
            font-family: 'Major Mono Display', monospace;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
        }
        .cookie-accept {
            background: #00D4FF;
            color: #0A0A0A;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }
        .cookie-accept:hover {
            background: #00F0FF;
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(0, 212, 255, 0.5);
        }
        .cookie-reject {
            background: transparent;
            color: #00B4D8;
            border: 1px solid #00D4FF !important;
        }
        .cookie-reject:hover {
            border-color: #00F0FF !important;
            color: #00F0FF;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.8rem 5%;
            flex-wrap: wrap;
            gap: 1rem;
            position: relative;
            z-index: 10;
        }
        .logo {
            font-size: 2.2rem;
            font-weight: 900;
            color: #00D4FF;
            text-decoration: none;
            letter-spacing: 0.1em;
            font-family: 'Orbitron', cursive;
            text-shadow: 0 0 40px rgba(0, 212, 255, 0.3), 0 0 80px rgba(0, 212, 255, 0.1);
        }
        .logo:hover {
            text-shadow: 0 0 60px rgba(0, 212, 255, 0.5), 0 0 120px rgba(0, 212, 255, 0.2);
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #00B4D8;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s;
            position: relative;
            letter-spacing: 0.15em;
            font-family: 'Major Mono Display', monospace;
            text-transform: uppercase;
        }
        .nav-links a:hover {
            color: #00F0FF;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: #00D4FF;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            transition: width 0.3s;
        }
        .nav-links a:hover::after {
            width: 100%;
        }
        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem 5%;
            background-image: url('https://iili.io/CDxyUOv.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            background-attachment: fixed;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 10, 0.75);
            z-index: 1;
        }
        .hero * { position: relative; z-index: 2; }
        .hero h1 {
            font-size: clamp(4rem, 15vw, 8rem);
            font-weight: 900;
            line-height: 1.1;
            color: #00D4FF;
            text-shadow: 0 0 80px rgba(0, 212, 255, 0.2), 0 0 160px rgba(0, 212, 255, 0.1);
            font-family: 'Orbitron', cursive;
            letter-spacing: 0.05em;
        }
        .hero .subhead {
            font-size: 1.6rem;
            color: #00B4D8;
            margin-top: 0.5rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            text-shadow: 0 0 40px rgba(0, 212, 255, 0.15);
            font-family: 'Major Mono Display', monospace;
            text-transform: uppercase;
        }
        .hero .tagline {
            font-size: 1.1rem;
            color: #90E0EF;
            margin-top: 1rem;
            max-width: 500px;
            opacity: 0.9;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 300;
            letter-spacing: 0.05em;
        }
        .cta-btn {
            margin-top: 2.5rem;
            padding: 1rem 3.5rem;
            font-family: 'Major Mono Display', monospace;
            font-weight: 700;
            font-size: 1rem;
            background: #00D4FF;
            border: none;
            color: #0A0A0A;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 0 60px rgba(0, 212, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .cta-btn:hover {
            background: #00F0FF;
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 0 80px rgba(0, 212, 255, 0.4);
        }
        .social-bar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 1.5rem 5%;
            background: rgba(10, 10, 10, 0.95);
            border-top: 1px solid rgba(0, 212, 255, 0.1);
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
            flex-wrap: wrap;
        }
        .social-bar a {
            color: #00B4D8;
            font-size: 1.5rem;
            text-decoration: none;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .social-bar a:hover {
            color: #00F0FF;
            transform: translateY(-3px);
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
        }
        .social-bar a .label {
            font-size: 0.65rem;
            color: #00B4D8;
            font-family: 'Major Mono Display', monospace;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .content-section {
            padding: 4rem 5%;
            max-width: 1300px;
            margin: 0 auto;
        }
        .content-section h2 {
            text-align: center;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 900;
            color: #00D4FF;
            margin-bottom: 2rem;
            font-family: 'Orbitron', cursive;
            letter-spacing: 0.05em;
            text-shadow: 0 0 40px rgba(0, 212, 255, 0.1);
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }
        .video-grid iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 16px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            transition: all 0.3s;
        }
        .video-grid iframe:hover {
            border-color: #00D4FF;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.1);
        }
        .music-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2.5rem;
            margin-bottom: 4rem;
        }
        .track-card {
            background: rgba(15, 15, 15, 0.9);
            border-radius: 20px;
            padding: 1.8rem;
            border: 1px solid rgba(0, 212, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.4s;
        }
        .track-card:hover {
            border-color: #00D4FF;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.06);
            transform: translateY(-6px);
        }
        .track-card h3 {
            font-size: 1.5rem;
            color: #00D4FF;
            font-weight: 700;
            font-family: 'Orbitron', cursive;
            letter-spacing: 0.05em;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
        }
        .track-card .artist {
            color: #00B4D8;
            font-size: 0.85rem;
            margin-bottom: 0.8rem;
            font-family: 'Major Mono Display', monospace;
        }
        .track-card .soundcloud-embed {
            width: 100%;
            height: 120px;
            border-radius: 10px;
            margin: 0.8rem 0;
            border: none;
        }
        .streaming-icons {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(0, 212, 255, 0.1);
        }
        .streaming-icons a {
            color: #00B4D8;
            font-size: 1.3rem;
            transition: all 0.3s;
            text-decoration: none;
        }
        .streaming-icons a:hover {
            color: #00F0FF;
            transform: scale(1.15);
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }
        .streaming-icons a .label {
            font-size: 0.55rem;
            display: block;
            text-align: center;
            color: #00B4D8;
            margin-top: 2px;
            font-family: 'Major Mono Display', monospace;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .merch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
            margin-top: 2rem;
            margin-bottom: 4rem;
        }
        .merch-item {
            background: rgba(15, 15, 15, 0.9);
            border-radius: 20px;
            padding: 1.8rem;
            border: 1px solid rgba(0, 212, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.4s;
            text-align: center;
        }
        .merch-item:hover {
            border-color: #00D4FF;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.06);
            transform: translateY(-6px);
        }
        .merch-item .merch-image {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 12px;
            background-size: cover;
            background-position: center;
            margin-bottom: 1rem;
            border: 1px solid rgba(0, 212, 255, 0.1);
            transition: all 0.3s;
        }
        .merch-item .merch-image:hover {
            border-color: #00D4FF;
            transform: scale(1.02);
        }
        .merch-item h3 {
            font-size: 1.2rem;
            color: #00D4FF;
            margin-bottom: 0.3rem;
            font-family: 'Orbitron', cursive;
            letter-spacing: 0.05em;
        }
        .merch-item .tag {
            display: inline-block;
            background: #00D4FF;
            color: #0A0A0A;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.2rem 1rem;
            border-radius: 20px;
            text-align: center;
            margin: 0 auto 1rem;
            display: table;
            letter-spacing: 0.1em;
            font-family: 'Major Mono Display', monospace;
            text-transform: uppercase;
        }
        .merch-item .buy-btn {
            display: inline-block;
            padding: 0.7rem 2.5rem;
            background: #00D4FF;
            color: #0A0A0A;
            font-weight: 700;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s;
            font-family: 'Major Mono Display', monospace;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            border: none;
            cursor: pointer;
            margin-top: 0.5rem;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
        }
        .merch-item .buy-btn:hover {
            background: #00F0FF;
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(0, 212, 255, 0.4);
        }
        .contact-form-section {
            padding: 3rem 5%;
            max-width: 800px;
            margin: 0 auto;
        }
        .contact-form-section h2 {
            text-align: center;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 900;
            color: #00D4FF;
            margin-bottom: 0.5rem;
            font-family: 'Orbitron', cursive;
            letter-spacing: 0.05em;
            text-shadow: 0 0 40px rgba(0, 212, 255, 0.1);
        }
        .contact-form-section .form-sub {
            text-align: center;
            color: #00B4D8;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            margin-bottom: 2rem;
            font-family: 'Major Mono Display', monospace;
            text-transform: uppercase;
        }
        .contact-form-wrapper {
            background: rgba(15, 15, 15, 0.9);
            padding: 2.5rem;
            border-radius: 20px;
            border: 1px solid rgba(0, 212, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        .contact-form-wrapper label {
            display: block;
            color: #00B4D8;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-family: 'Major Mono Display', monospace;
        }
        .contact-form-wrapper input,
        .contact-form-wrapper textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 10px;
            color: #E0E0E0;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            margin-bottom: 1.2rem;
            transition: border-color 0.3s;
        }
        .contact-form-wrapper input:focus,
        .contact-form-wrapper textarea:focus {
            outline: none;
            border-color: #00D4FF;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.05);
        }
        .contact-form-wrapper textarea {
            min-height: 130px;
            resize: vertical;
        }
        .contact-form-wrapper .send-btn {
            padding: 0.9rem 3rem;
            background: #00D4FF;
            border: none;
            border-radius: 50px;
            color: #0A0A0A;
            font-family: 'Major Mono Display', monospace;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
        }
        .contact-form-wrapper .send-btn:hover {
            background: #00F0FF;
            transform: scale(1.02);
            box-shadow: 0 0 60px rgba(0, 212, 255, 0.4);
        }
        .soundplate-link {
            text-align: center;
            padding: 2rem 5%;
        }
        .soundplate-link a {
            display: inline-block;
            padding: 0.8rem 2.5rem;
            background: #00D4FF;
            color: #0A0A0A;
            font-weight: 700;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s;
            font-size: 0.95rem;
            font-family: 'Major Mono Display', monospace;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.2);
        }
        .soundplate-link a:hover {
            background: #00F0FF;
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(0, 212, 255, 0.4);
        }
        footer {
            text-align: center;
            padding: 2rem 5%;
            color: #00B4D8;
            font-size: 0.8rem;
            border-top: 1px solid rgba(0, 212, 255, 0.1);
            margin-top: 2rem;
            font-family: 'Major Mono Display', monospace;
        }
        footer a {
            color: #00D4FF;
            text-decoration: none;
        }
        footer a:hover {
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }
        @media (max-width: 768px) {
            nav { flex-direction: column; }
            .nav-links { gap: 1rem; justify-content: center; }
            .social-bar { gap: 1.2rem; }
            .social-bar a { font-size: 1.2rem; }
            .music-grid { grid-template-columns: 1fr; }
            .merch-grid { grid-template-columns: 1fr; }
            .video-grid { grid-template-columns: 1fr; }
            .cookie-banner { flex-direction: column; text-align: center; }
            .cookie-buttons { width: 100%; justify-content: center; }
            .contact-form-wrapper { padding: 1.5rem; }
        }
        @media (max-width: 480px) {
            .hero h1 { font-size: clamp(3rem, 12vw, 4.5rem); }
            .hero .subhead { font-size: 1rem; letter-spacing: 0.15em; }
        }
    </style>
</head>
