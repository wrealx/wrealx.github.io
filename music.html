<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Music · Wreal X</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Space+Grotesk:wght@300;400;600;700&family=Major+Mono+Display&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #0A0A0A;
            color: #E0E0E0;
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.8rem 5%;
            flex-wrap: wrap;
            gap: 1rem;
            position: relative;
            z-index: 10;
        }
        .logo {
            font-size: 2.2rem;
            font-weight: 900;
            color: #39FF14;
            text-decoration: none;
            letter-spacing: 0.1em;
            font-family: 'Orbitron', cursive;
            text-shadow: 0 0 40px rgba(57, 255, 20, 0.3), 0 0 80px rgba(57, 255, 20, 0.1);
        }
        .logo:hover {
            text-shadow: 0 0 60px rgba(57, 255, 20, 0.5), 0 0 120px rgba(57, 255, 20, 0.2);
        }
        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.5rem 1.2rem;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
        }
        .nav-links a:hover {
            color: #39FF14;
            border-color: #39FF14;
            background: rgba(57, 255, 20, 0.1);
            text-shadow: 0 0 30px rgba(57, 255, 20, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.1);
        }
        .hero-bg {
            min-height: 40vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem 5%;
            background-image: url('https://iili.io/CD0qtob.png');
            background-size: cover;
            background-position: center;
            position: relative;
            background-attachment: fixed;
        }
        .hero-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 10, 0.5);
            z-index: 0;
        }
        .hero-bg * { position: relative; z-index: 1; }
        .hero-bg h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 900;
            color: #FFFFFF;
            font-family: 'Orbitron', cursive;
            text-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
        }
        .page-sub {
            text-align: center;
            color: #39FF14;
            font-size: 1.2rem;
            letter-spacing: 0.1em;
            margin-top: 0.2rem;
            font-family: 'Space Grotesk', sans-serif;
        }
        /* LATEST RELEASE */
        .release-section {
            padding: 4rem 5%;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        .release-section h2 {
            text-align: center;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 900;
            color: #FFFFFF;
            margin-bottom: 2rem;
            font-family: 'Orbitron', cursive;
            letter-spacing: 0.05em;
            text-shadow: 0 0 40px rgba(0, 0, 0, 0.3);
        }
        .release-cover {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1/1;
            margin: 0 auto 1.5rem;
            border-radius: 20px;
            background-size: cover;
            background-position: center;
            border: 2px solid rgba(57, 255, 20, 0.3);
            box-shadow: 0 0 60px rgba(57, 255, 20, 0.15);
            transition: all 0.3s;
        }
        .release-cover:hover {
            border-color: #39FF14;
            box-shadow: 0 0 80px rgba(57, 255, 20, 0.3);
            transform: scale(1.02);
        }
        .release-title {
            font-size: 2rem;
            font-weight: 900;
            color: #FFFFFF;
            font-family: 'Orbitron', cursive;
            margin-bottom: 0.3rem;
        }
        .release-artist {
            font-size: 1rem;
            color: #FFFFFF;
            opacity: 0.6;
            margin-bottom: 1.5rem;
            font-family: 'Space Grotesk', sans-serif;
        }
        .stream-btn {
            display: inline-block;
            padding: 1rem 3.5rem;
            background: #39FF14;
            color: #0A0A0A;
            font-weight: 700;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            font-size: 1.1rem;
            letter-spacing: 0.15em;
            box-shadow: 0 0 40px rgba(57, 255, 20, 0.2);
        }
        .stream-btn:hover {
            background: #00FF41;
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 0 60px rgba(57, 255, 20, 0.4);
        }
        /* OTHER RELEASES */
        .recent-releases {
            padding: 2rem 5% 4rem;
            max-width: 1300px;
            margin: 0 auto;
        }
        .recent-releases h2 {
            text-align: center;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 900;
            color: #FFFFFF;
            margin-bottom: 2rem;
            font-family: 'Orbitron', cursive;
            letter-spacing: 0.05em;
            text-shadow: 0 0 40px rgba(0, 0, 0, 0.3);
        }
        .release-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 2.5rem;
        }
        .release-item {
            background: rgba(15, 15, 15, 0.9);
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.4s;
            text-align: center;
        }
        .release-item:hover {
            border-color: #39FF14;
            box-shadow: 0 0 40px rgba(57, 255, 20, 0.06);
            transform: translateY(-6px);
        }
        .release-item .cover-img {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 12px;
            background-size: cover;
            background-position: center;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }
        .release-item .cover-img:hover {
            border-color: #39FF14;
            transform: scale(1.02);
        }
        .release-item h3 {
            font-size: 1.2rem;
            color: #FFFFFF;
            margin-bottom: 0.3rem;
            font-family: 'Orbitron', cursive;
            letter-spacing: 0.05em;
        }
        .release-item .artist-name {
            color: #FFFFFF;
            font-size: 0.8rem;
            opacity: 0.5;
            margin-bottom: 1rem;
            font-family: 'Space Grotesk', sans-serif;
        }
        .release-item .small-stream-btn {
            display: inline-block;
            padding: 0.6rem 2rem;
            background: #39FF14;
            color: #0A0A0A;
            font-weight: 700;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.15);
        }
        .release-item .small-stream-btn:hover {
            background: #00FF41;
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(57, 255, 20, 0.3);
        }
        /* STREAM WREAL X CTA */
        .stream-cta {
            text-align: center;
            padding: 2rem 5% 3rem;
        }
        .stream-cta a {
            display: inline-block;
            padding: 1rem 3.5rem;
            background: #39FF14;
            color: #0A0A0A;
            font-weight: 700;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            font-size: 1.1rem;
            letter-spacing: 0.15em;
            box-shadow: 0 0 40px rgba(57, 255, 20, 0.2);
        }
        .stream-cta a:hover {
            background: #00FF41;
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(57, 255, 20, 0.4);
        }
        footer {
            text-align: center;
            padding: 2rem 5%;
            color: #FFFFFF;
            font-size: 0.8rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 1rem;
            font-family: 'Space Grotesk', sans-serif;
            opacity: 0.4;
        }
        footer a {
            color: #39FF14;
            text-decoration: none;
        }
        @media (max-width: 768px) {
            nav { flex-direction: column; }
            .nav-links { gap: 0.8rem; justify-content: center; }
            .nav-links a { padding: 0.3rem 0.8rem; font-size: 0.8rem; }
            .release-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
