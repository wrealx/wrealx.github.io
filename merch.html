<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Merch · Wreal X</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #0A0A0A; color: #E0E0E0; font-family: 'Inter', 'Segoe UI', sans-serif; min-height: 100vh; overflow-x: hidden; overflow-y: auto;
    }
    a, button, input, textarea, select { font-family: 'Inter', 'Segoe UI', sans-serif; }
    nav {
      display: flex; justify-content: space-between; align-items: center; padding: 1.8rem 5%; flex-wrap: wrap; gap: 1rem; position: relative; z-index: 10;
    }
    .logo { display: inline-block; font-size: 2.2rem; font-weight: 900; color: #39FF14; text-decoration: none; letter-spacing: 0.1em; text-shadow: 0 0 40px rgba(57,255,20,0.3), 0 0 80px rgba(57,255,20,0.1); }
    .logo:hover { text-shadow: 0 0 60px rgba(57,255,20,0.5), 0 0 120px rgba(57,255,20,0.2); }
    #nav-toggle { position: absolute; opacity: 0; pointer-events: none; }
    .nav-toggle {
      display: none; position: absolute; right: 5%; top: 1.5rem; width: 48px; height: 48px; border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; background: rgba(255,255,255,0.04); cursor: pointer; z-index: 20; align-items: center; justify-content: center; flex-direction: column; gap: 5px;
    }
    .nav-toggle .bar { display: block; width: 22px; height: 2px; border-radius: 2px; background: #FFFFFF; }
    .nav-links { display: flex; gap: 1.5rem; list-style: none; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
    .nav-links a {
      color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 0.5rem 1rem; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; background: rgba(255,255,255,0.04); transition: all 0.3s ease;
    }
    .nav-links a:hover { color: #39FF14; border-color: #39FF14; background: rgba(57,255,20,0.1); transform: translateY(-2px); }
    .hero { min-height: 220px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 2rem 5% 1rem; }
    .hero h1 { font-size: clamp(2.8rem, 7vw, 5rem); font-weight: 900; letter-spacing: 0.08em; margin-bottom: 0.5rem; }
    .hero .arabic { color: #39FF14; font-size: clamp(1.1rem, 3vw, 1.8rem); font-weight: 700; letter-spacing: 0.12em; }
    .merch-grid { max-width: 1100px; margin: 0 auto; padding: 2rem 5% 4rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; }
    .item { background: rgba(20,20,20,0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 1.4rem; text-align: center; }
    .item .visual { width: 100%; aspect-ratio: 1; background: linear-gradient(135deg, rgba(57,255,20,0.2), rgba(255,255,255,0.08)); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #39FF14; font-weight: 800; letter-spacing: 0.1em; margin-bottom: 1rem; }
    .item h3 { margin-bottom: 0.5rem; color: #FFFFFF; }
    .item a { display: inline-block; margin-top: 1rem; padding: 0.8rem 1.5rem; background: #39FF14; color: #0A0A0A; font-weight: 800; border-radius: 999px; text-decoration: none; text-transform: uppercase; letter-spacing: 0.08em; }
    @media (max-width: 768px) {
      nav { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 5%; }
      .logo { font-size: 1.4rem; letter-spacing: 0.08em; }
      .nav-toggle { display: flex; }
      .nav-links {
        position: absolute; top: 4.6rem; right: 5%; flex-direction: column; gap: 0.75rem; align-items: stretch; min-width: 180px; padding: 0.85rem; background: rgba(10,10,10,0.95); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; box-shadow: 0 20px 40px rgba(0,0,0,0.35); opacity: 0; transform: translateX(120%); pointer-events: none; transition: transform 0.35s ease, opacity 0.35s ease;
      }
      #nav-toggle:checked ~ .nav-links { opacity: 1; transform: translateX(0); pointer-events: auto; }
      .nav-links a { width: 100%; text-align: center; padding: 0.8rem 1rem; font-size: 0.72rem; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="logo">WREAL X</a>
    <input type="checkbox" id="nav-toggle" aria-label="Toggle navigation">
    <label for="nav-toggle" class="nav-toggle" aria-label="Open menu">
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </label>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="music.html">Music</a></li>
      <li><a href="merch.html">Merch</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <section class="hero">
    <h1>MERCH</h1>
    <div class="arabic">CURSED</div>
  </section>

  <div class="merch-grid">
    <div class="item">
      <div class="visual">X PURFER</div>
      <h3>X Purfer Vest</h3>
      <p>Limited drop for the nightshift set.</p>
      <a href="#">Buy now</a>
    </div>
    <div class="item">
      <div class="visual">X HOODIE</div>
      <h3>X On Hoodie</h3>
      <p>Heavy cotton, sharp silhouette, quiet chaos.</p>
      <a href="#">Pre-order</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const navToggle = document.getElementById('nav-toggle');
      const navLinks = document.querySelectorAll('.nav-links a');
      navLinks.forEach(function (link) {
        link.addEventListener('click', function () {
          if (window.innerWidth <= 768 && navToggle) navToggle.checked = false;
        });
      });
    });
  </script>
</body>
</html>
