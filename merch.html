<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Merch · Wreal X</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Space+Grotesk:wght@300;400;600;700&family=Major+Mono+Display&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #0A0A0A;
            color: #E0E0E0;
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.8rem 5%;
            flex-wrap: wrap;
            gap: 1rem;
            position: relative;
            z-index: 10;
        }
        .logo {
            font-size: 2.2rem;
            font-weight: 900;
            color: #39FF14;
            text-decoration: none;
            letter-spacing: 0.1em;
            font-family: 'Orbitron', cursive;
            text-shadow: 0 0 40px rgba(57, 255, 20, 0.3), 0 0 80px rgba(57, 255, 20, 0.1);
        }
        .logo:hover {
            text-shadow: 0 0 60px rgba(57, 255, 20, 0.5), 0 0 120px rgba(57, 255, 20, 0.2);
        }
        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.5rem 1.2rem;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
        }
        .nav-links a:hover {
            color: #39FF14;
            border-color: #39FF14;
            background: rgba(57, 255, 20, 0.1);
            text-shadow: 0 0 30px rgba(57, 255, 20, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.1);
        }
        .hero-bg {
            min-height: 40vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem 5%;
            background-image: url('https://iili.io/CD0qtob.png');
            background-size: cover;
            background-position: center;
            position: relative;
            background-attachment: fixed;
        }
        .hero-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 10, 0.5);
            z-index: 0;
        }
        .hero-bg * { position: relative; z-index: 1; }
        .hero-bg h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 900;
            color: #FFFFFF;
            font-family: 'Orbitron', cursive;
            text-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
        }
        .page-sub {
            text-align: center;
            color: #FFFFFF;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            margin-top: 0.2rem;
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            opacity: 0.6;
        }
        .merch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2.5rem;
            padding: 3rem 5%;
            max-width: 1300px;
            margin: 0 auto;
        }
        .merch-item {
            background: rgba(15, 15, 15, 0.9);
            border-radius: 20px;
            padding: 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.4s;
            text-align: center;
        }
        .merch-item:hover {
            border-color: #39FF14;
            box-shadow: 0 0 40px rgba(57, 255, 20, 0.06);
            transform: translateY(-6px);
        }
        .merch-item .merch-image {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 12px;
            background-size: cover;
            background-position: center;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }
        .merch-item .merch-image:hover {
            border-color: #39FF14;
            transform: scale(1.02);
        }
        .merch-item h3 {
            font-size: 1.3rem;
            color: #FFFFFF;
            margin-bottom: 0.3rem;
            font-family: 'Orbitron', cursive;
            letter-spacing: 0.05em;
        }
        .merch-item .tag {
            display: inline-block;
            background: #39FF14;
            color: #0A0A0A;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.2rem 1rem;
            border-radius: 20px;
            text-align: center;
            margin: 0 auto 1rem;
            display: table;
            letter-spacing: 0.1em;
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
        }
        .merch-item .buy-btn {
            display: inline-block;
            padding: 0.8rem 3rem;
            background: #39FF14;
            color: #0A0A0A;
            font-weight: 700;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            border: none;
            cursor: pointer;
            margin-top: 0.5rem;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.2);
        }
        .merch-item .buy-btn:hover {
            background: #00FF41;
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(57, 255, 20, 0.4);
        }
        .soundplate-link {
            text-align: center;
            padding: 1rem 5% 2rem;
        }
        .soundplate-link a {
            display: inline-block;
            padding: 0.8rem 2.5rem;
            background: #39FF14;
            color: #0A0A0A;
            font-weight: 700;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s;
            font-size: 0.95rem;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            box-shadow: 0 0 40px rgba(57, 255, 20, 0.2);
        }
        .soundplate-link a:hover {
            background: #00FF41;
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(57, 255, 20, 0.4);
        }
        footer {
            text-align: center;
            padding: 2rem 5%;
            color: #FFFFFF;
            font-size: 0.8rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 1rem;
            font-family: 'Space Grotesk', sans-serif;
            opacity: 0.4;
        }
        footer a {
            color: #39FF14;
            text-decoration: none;
        }
        @media (max-width: 768px) {
            nav { flex-direction: column; }
            .nav-links { gap: 0.8rem; justify-content: center; }
            .nav-links a { padding: 0.3rem 0.8rem; font-size: 0.8rem; }
            .merch-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="hero-bg">
    <h1>MERCH</h1>
    <p class="page-sub">— wear the movement —</p>
</div>

<div class="merch-grid">
    <div class="merch-item">
        <div class="merch-image" style="background-image: url('https://iili.io/CDCdmBt.png');"></div>
        <h3>X PURFER VEST</h3>
        <span class="tag">Limited Edition</span>
        <a href="https://payhip.com/b/wP6EI" target="_blank" class="buy-btn">Buy Now</a>
    </div>

    <div class="merch-item">
        <div class="merch-image" style="background-image: url('https://iili.io/CDCA0KJ.png');"></div>
        <h3>X ON HOODIE</h3>
        <span class="tag">Pre-Order</span>
        <a href="https://payhip.com/b/eyvrw" target="_blank" class="buy-btn">Buy Now</a>
    </div>
</div>

<div class="soundplate-link">
    <a href="https://snd.click/xvy9" target="_blank"><i class="fas fa-link"></i> Soundplate · Exclusive Content</a>
</div>

<footer>

</footer>
