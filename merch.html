<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>WREAL X - SHOP NOW</title>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu&family=Gamja+Flower&family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Gaegu', 'Gamja Flower', 'Jua', 'Nanum Pen Script', monospace;
            background: linear-gradient(135deg, #1a0000 0%, #3d0c0c 50%, #7a1f1f 100%);
            color: #fff2e6;
            line-height: 1.5;
            min-height: 100vh;
        }
        .header {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff6600;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            font-family: 'Gaegu', 'Gamja Flower', 'Jua', cursive;
            background: linear-gradient(45deg, #ff4500, #ff8c00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
        }
        .back-btn {
            background: linear-gradient(45deg, #ff6600, #ff8c00);
            color: #000;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-family: 'Gaegu', 'Gamja Flower', 'Jua', monospace;
        }
        .hero-small {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://iili.io/C9aXwuI.jpg');
            background-size: cover;
            background-position: center;
            height: 25vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .hero-small h1 {
            font-size: 2rem;
            font-family: 'Gaegu', 'Gamja Flower', 'Jua', cursive;
            color: #ffcc00;
        }
        .shop-title {
            text-align: center;
            font-size: 1.8rem;
            margin: 2rem 0 1rem;
            font-family: 'Gaegu', 'Gamja Flower', 'Jua', cursive;
            background: linear-gradient(45deg, #ff6600, #ffcc00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .merch-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 1rem 2rem;
        }
        .card {
            background: rgba(0,0,0,0.7);
            border-radius: 16px;
            text-align: center;
            padding-bottom: 1.5rem;
            border: 1px solid #ff6600;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover { transform: translateY(-5px); border-color: #ffcc00; }
        .card img { width: 100%; height: 250px; object-fit: cover; border-radius: 16px 16px 0 0; border-bottom: 1px solid #ff6600; }
        .card h3 { font-size: 1.3rem; margin: 1rem 0 0.3rem; color: #ffcc88; font-family: 'Gaegu', 'Gamja Flower', 'Jua', monospace; }
        .price { font-size: 1.2rem; font-weight: bold; color: #ffcc00; margin: 0.3rem 0; }
        .buy-btn {
            display: inline-block;
            background: linear-gradient(45deg, #ff6600, #ff8c00);
            color: #000;
            border: none;
            padding: 0.6rem 2rem;
            margin: 0.8rem 0;
            cursor: pointer;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            font-family: 'Gaegu', 'Gamja Flower', 'Jua', monospace;
            transition: transform 0.2s;
        }
        .buy-btn:hover { transform: scale(1.05); background: linear-gradient(45deg, #ff7700, #ffaa00); }
        @media (max-width: 700px) { .merch-grid { grid-template-columns: 1fr; gap: 1.5rem; } .card img { height: 200px; } }
        .footer { text-align: center; padding: 1.5rem; border-top: 1px solid #ff6600; margin-top: 2rem; font-size: 0.7rem; color: #ffaa66; }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="logo">WREAL X</a>
        <a href="index.html" class="back-btn">← BACK TO HOME</a>
    </div>
    <div class="hero-small"><h1>🛍️ SHOP NOW</h1></div>
    <h2 class="shop-title">MERCHANDISE</h2>

    <div class="merch-grid">
        <div class="card">
            <img src="https://iili.io/C6lJNwP.png" alt="X PURFER VEST">
            <h3>X PURFER VEST</h3>
            <div class="price">💰 $25.00</div>
            <a href="https://payhip.com/b/wP6EI" target="_blank" class="buy-btn">BUY NOW</a>
        </div>
        <div class="card">
            <img src="https://iili.io/C6lHE2R.png" alt="X MASKS">
            <h3>X MASKS</h3>
            <div class="price">💰 $5.00</div>
            <a href="https://payhip.com/b/WDlu9" target="_blank" class="buy-btn">BUY NOW</a>
        </div>
        <div class="card">
            <img src="https://iili.io/C6l3Kaj.png" alt="X ON HOODIE">
            <h3>X ON HOODIE</h3>
            <div class="price">💰 $30.00</div>
            <a href="https://payhip.com/b/eyvrw" target="_blank" class="buy-btn">BUY NOW</a>
        </div>
        <div class="card">
            <img src="https://iili.io/C6l2BLX.png" alt="X'ED TIGHTS">
            <h3>X'ED TIGHTS</h3>
            <div class="price">💰 $16.00</div>
            <a href="https://payhip.com/b/sLl4I" target="_blank" class="buy-btn">BUY NOW</a>
        </div>
    </div>

    <div class="footer">
        <p>© 2026 WREAL X | All Rights Reserved</p>
    </div>
</body>
                               </html>
